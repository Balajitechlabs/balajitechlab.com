name: Update Project Details

on:
  schedule:
    - cron: '0 0 * * *' # Midnight UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-details:
    name: Sync GitHub Repositories
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run sync script
        run: node .github/scripts/update-project-details.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changes if updated
        run: |
          git config --local user.email "212744006+Balajitechlabs@users.noreply.github.com"
          git config --local user.name "balajitechlabs"
          git add public/project-details.json || true
          if git diff --staged --quiet; then
            echo "No changes in project metadata."
          else
            git commit -m "chore(projects): automated daily sync of project details"
            git push
          fi
