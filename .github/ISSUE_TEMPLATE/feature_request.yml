name: Feature Request
description: Propose a new feature, component, or UX enhancement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for a cool feature or interactive component? Let us know!
  - type: input
    id: feature
    attributes:
      label: Feature Title
      description: Short title for the proposed idea.
      placeholder: e.g. Add 3D interactive hardware model to showcase section
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem & Motivation
      description: Why should this feature be added? What problem does it solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How do you envision this working?
    validations:
      required: false
