name: Bug Report
description: File a bug report or UI defect
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue!
  - type: input
    id: summary
    attributes:
      label: Bug Summary
      description: A concise summary of the issue.
      placeholder: e.g. Shader background glitches on Safari 18
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this bug?
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS version, device
      placeholder: e.g. macOS Sonoma, Chrome 128, Apple Silicon M1
    validations:
      required: false
